model_list:
  # Mock upstream: proves the gateway path with no provider credential.
  - model_name: mock-echo
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: "sk-not-a-real-key"
      mock_response: "pong from litellm"

  # Real routes, inert until a provider key exists in the environment.
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  database_url: "postgresql://dawn:dawn@127.0.0.1:55432/litellm"

litellm_settings:
  drop_params: true
