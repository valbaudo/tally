name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# The repo is at v0-not-started: go.mod and docs, no packages. These steps are
# vacuous today and that is deliberate — CI that asserts a guarantee no code
# makes is how the old platform matrix ended up passing while both documented
# guarantees silently did not hold on Windows.
#
# Restore, when v0 lands: the unsupported-platform refusal (the netns boundary
# is Linux-native; Docker on macOS is a VM, so whether the boundary holds
# identically on both is unsettled), and race coverage for the proxy's atomic
# budget reserve, which is the one contended write in the design.
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race ./...
      - run: go vet ./...
